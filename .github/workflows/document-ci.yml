name: Document Quality Gates CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Audit & Test Swarm Document
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Typst CLI
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 'latest'

      - name: Install SynapseForge and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyyaml requests markdown jinja2 matplotlib

      - name: Run SynapseForge Core Unit Tests
        run: |
          pytest -v tests/

      - name: Execute Document Quality Gates (Anti-AI, Coherence, Style, Citations)
        run: |
          synapseforge lint --ci

      - name: Compile Publication Artifacts (HTML, Typst, Markdown)
        run: |
          synapseforge build

      - name: Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publication-artifacts
          path: dist/
          retention-days: 14
